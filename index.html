<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Exam Allocation Manager</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap");
      :root {
        --ink: #192820;
        --muted: #758078;
        --line: #e6eae5;
        --paper: #fbfcfa;
        --green: #35664b;
        --mint: #eaf3ed;
        --orange: #b96c2c;
        --red: #b44f48;
        --shadow: 0 12px 36px #1833240a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px "DM Sans",
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 248px;
        background: #f3f6f1;
        border-right: 1px solid var(--line);
        padding: 26px 18px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font:
          700 16px Manrope,
          sans-serif;
        padding: 0 8px 34px;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: #315f45;
        color: white;
        display: grid;
        place-items: center;
        font-size: 17px;
      }
      .side-label {
        font-size: 10px;
        letter-spacing: 1.2px;
        color: #909991;
        font-weight: 700;
        padding: 0 10px 10px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        border: 0;
        background: transparent;
        text-align: left;
        padding: 11px 12px;
        border-radius: 9px;
        color: #627067;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .nav button.active {
        background: white;
        color: #234d35;
        font-weight: 700;
        box-shadow: 0 2px 8px #18332409;
      }
      .nav-icon {
        width: 18px;
        text-align: center;
        font-size: 15px;
      }
      .sidebar-foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 18px 8px 0;
        color: #7e8980;
        font-size: 12px;
        line-height: 1.7;
      }
      .status-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #6eaa7d;
        margin-right: 6px;
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .topbar {
        height: 70px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
        background: #fff;
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #56645a;
      }
      .avatar {
        width: 30px;
        height: 30px;
        background: #e5eee7;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #315f45;
        font-weight: 700;
      }
      .content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 42px 70px;
      }
      .eyebrow {
        font-size: 11px;
        color: #65806d;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 10px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font:
          700 30px Manrope,
          sans-serif;
        letter-spacing: -0.7px;
        margin-bottom: 8px;
      }
      h2 {
        font:
          700 20px Manrope,
          sans-serif;
        letter-spacing: -0.3px;
        margin-bottom: 6px;
      }
      h3 {
        font:
          700 14px Manrope,
          sans-serif;
        margin-bottom: 6px;
      }
      .lead {
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .stepper {
        display: flex;
        gap: 10px;
        margin: 27px 0 30px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #a0a8a1;
        font-size: 12px;
        font-weight: 600;
      }
      .step:not(:last-child):after {
        content: "";
        width: 44px;
        height: 1px;
        background: #dfe5df;
        margin-left: 6px;
      }
      .step b {
        border: 1px solid #dce3dc;
        width: 23px;
        height: 23px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
      }
      .step.on {
        color: #315f45;
      }
      .step.on b,
      .step.done b {
        border-color: #315f45;
        background: #315f45;
        color: white;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .upload-card {
        padding: 19px 20px;
        display: flex;
        gap: 14px;
        min-height: 116px;
        align-items: flex-start;
        transition: 0.18s;
      }
      .upload-card:hover {
        border-color: #b7cabb;
      }
      .file-icon {
        width: 39px;
        height: 39px;
        border-radius: 10px;
        background: #eff5f0;
        color: #35664b;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 11px;
        flex-shrink: 0;
      }
      .upload-info {
        flex: 1;
        min-width: 0;
      }
      .upload-info h3 {
        margin: 2px 0 5px;
      }
      .upload-info p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
        line-height: 1.45;
      }
      .badge {
        font-size: 10px;
        color: #778177;
        border: 1px solid #e4e8e2;
        padding: 4px 7px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .badge.required {
        color: #946940;
        background: #fbf5ec;
        border-color: #f1e4d2;
      }
      .badge.valid {
        color: #357148;
        background: #eef7ef;
        border-color: #dceede;
      }
      .badge.error {
        color: #a74741;
        background: #fdf0ef;
        border-color: #f2d9d7;
      }
      .badge.loaded {
        color: #35664b;
        background: #eff5f0;
        border-color: #dfebe1;
      }
      .file-name {
        display: block;
        font-size: 11px;
        color: #477252;
        margin-top: 7px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 30px 0 12px;
      }
      .section-head p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
      .hint {
        background: #f0f5f0;
        border: 1px solid #e2ebe2;
        border-radius: 10px;
        padding: 15px 17px;
        color: #546458;
        font-size: 12px;
        line-height: 1.65;
        margin-top: 22px;
      }
      .hint strong {
        color: #315f45;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }
      .btn {
        border: 1px solid #dce3dc;
        border-radius: 8px;
        background: white;
        padding: 10px 15px;
        color: #425046;
        font-weight: 600;
        font-size: 12px;
      }
      .btn:hover {
        background: #f7faf7;
      }
      .btn.primary {
        background: #315f45;
        border-color: #315f45;
        color: white;
      }
      .btn.primary:hover {
        background: #284f39;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .metric-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 23px 0;
      }
      .metric {
        padding: 17px 18px;
      }
      .metric label {
        font-size: 11px;
        color: var(--muted);
      }
      .metric strong {
        display: block;
        font: 700 25px Manrope;
        margin-top: 7px;
      }
      .metric span {
        font-size: 11px;
        color: #7d887f;
      }
      .validation-list {
        display: grid;
        gap: 9px;
      }
      .validation-row {
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .validation-left {
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .check {
        color: #438153;
        font-weight: 700;
      }
      .issues {
        padding: 16px 18px;
        border-color: #f0d5d1;
        background: #fffafa;
      }
      .issue-line {
        font-size: 12px;
        color: #934741;
        padding: 5px 0;
      }
      .table-wrap {
        overflow: auto;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      .data-table th {
        text-align: left;
        color: #818b82;
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        background: #f7f9f6;
        padding: 12px;
      }
      .data-table td {
        border-top: 1px solid var(--line);
        padding: 12px;
        white-space: nowrap;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        background: #f1f4f0;
        border-radius: 8px;
        padding: 4px;
      }
      .tabs button {
        border: 0;
        background: transparent;
        color: #748076;
        padding: 8px 13px;
        border-radius: 6px;
        font-size: 12px;
      }
      .tabs button.on {
        background: white;
        color: #315f45;
        font-weight: 700;
        box-shadow: 0 1px 4px #0000000c;
      }
      .booking {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 17px;
        border-top: 1px solid var(--line);
        align-items: center;
      }
      .booking:first-child {
        border-top: 0;
      }
      .booking strong {
        font-size: 13px;
      }
      .booking small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
      }
      .booking .time {
        color: #45564a;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .room-title {
        background: #f7f9f6;
        padding: 10px 17px;
        font-size: 11px;
        font-weight: 700;
        color: #627167;
      }
      .empty {
        padding: 42px 24px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .hidden {
        display: none !important;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #10201666;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .modal {
        background: white;
        border-radius: 14px;
        padding: 24px;
        max-width: 610px;
        width: 100%;
        max-height: 80vh;
        overflow: auto;
        box-shadow: 0 25px 80px #15241944;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .modal-head button {
        border: 0;
        background: none;
        font-size: 21px;
        color: #68756b;
      }
      .mono {
        font:
          11px Consolas,
          monospace;
        background: #f6f8f5;
        padding: 10px;
        border-radius: 7px;
        overflow: auto;
        white-space: pre;
      }
      .notice {
        font-size: 12px;
        color: #67756b;
        line-height: 1.6;
      }
      .footer-note {
        margin-top: 18px;
        font-size: 11px;
        color: #939b94;
      }
      /* Keep the equipment-view explanation inset from the card edges. */
      .equipment-footnote {
        margin: 14px 18px 18px;
        line-height: 1.6;
      }
      /* Inventory panels are native dropdowns; the chevron makes that clear. */
      .room-usage-panel summary {
        align-items: center;
      }
      .room-usage-panel summary strong {
        flex: 1 1 auto;
      }
      .room-usage-panel summary span {
        margin-left: auto;
        text-align: right;
      }
      .room-usage-panel summary::after {
        content: "▾";
        flex: 0 0 auto;
        margin-left: 8px;
        color: #758078;
        font-size: 15px;
        line-height: 1;
        transition: transform 0.15s ease;
      }
      .room-usage-panel[open] summary::after {
        transform: rotate(180deg);
      }
      @media (max-width: 760px) {
        .resource-inventory summary {
          flex-wrap: wrap;
        }
        .resource-inventory summary span {
          flex: 1 1 calc(100% - 28px);
          margin-left: 0;
          text-align: left;
        }
        .equipment-footnote {
          margin: 12px 14px 16px;
        }
      }
      @media (max-width: 760px) {
        .reserve-panel {
          grid-template-columns: 1fr;
        }
        .sidebar {
          width: 60px;
          padding: 20px 8px;
        }
        .brand {
          padding: 0 5px 27px;
        }
        .brand-name,
        .side-label,
        .nav-label,
        .sidebar-foot {
          display: none;
        }
        .nav button {
          justify-content: center;
          padding: 12px 8px;
        }
        .topbar {
          padding: 0 18px;
        }
        .content {
          padding: 28px 18px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .step {
          font-size: 10px;
        }
        .step:not(:last-child):after {
          width: 15px;
        }
        .metric-row {
          grid-template-columns: repeat(2, 1fr);
        }
        h1 {
          font-size: 26px;
        }
      }
      .reserve-panel {
        padding: 16px 18px;
        margin: 0 0 16px;
        display: grid;
        grid-template-columns: minmax(200px, 1fr) minmax(300px, 1.5fr) auto;
        gap: 16px;
        align-items: center;
        background: #f8faf7;
      }
      .reserve-panel h3 {
        margin: 0 0 5px;
      }
      .reserve-panel p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
      }
      .reserve-options {
        display: grid;
        gap: 8px;
        font-size: 11px;
        color: #4f5d52;
      }
      .reserve-options label {
        display: flex;
        gap: 7px;
        align-items: flex-start;
      }
      .reserve-options input {
        margin: 1px 0 0;
        accent-color: #35664b;
      }
      .action-plan {
        padding: 18px;
        margin: 0 0 18px;
        border-color: #ecd8bd;
        background: #fffdfa;
      }
      .action-plan-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .action-plan-head h2 {
        margin: 0;
      }
      .action-plan-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .action-tip {
        background: #fff;
        border: 1px solid #eee4d8;
        border-radius: 8px;
        padding: 12px;
      }
      .action-tip strong {
        font-size: 12px;
        color: #654b2e;
      }
      .action-tip p {
        font-size: 11px;
        line-height: 1.55;
        color: #625e58;
        margin: 6px 0 0;
      }
      .allocation-advice {
        font-size: 11px;
        color: #624b32;
        background: #fff8ef;
        border-left: 3px solid #dfad69;
        border-radius: 4px;
        padding: 8px 10px;
        margin: 7px 0 3px;
        line-height: 1.55;
      }
      .room-proctor {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: -6px 0 12px;
        font-size: 12px;
        color: #56645a;
      }
      .seat.needs-review {
        background: #fff0d9;
        border-color: #e7c68c;
        color: #87591e;
      }
      .status-pill {
        display: inline-block;
        margin-top: 4px;
        padding: 3px 7px;
        border-radius: 20px;
        background: #eaf4ec;
        color: #35664b;
        font-size: 10px;
        font-weight: 700;
        text-transform: capitalize;
      }
      .status-pill.partial {
        background: #fff4e5;
        color: #935f1c;
      }
      .status-pill.unassigned {
        background: #fff0ef;
        color: #a34740;
      }
      .room-usage-panel{margin:0 0 16px;padding:0 16px}.room-usage-panel summary{cursor:pointer;list-style:none;padding:15px 2px;display:flex;justify-content:space-between;gap:12px;font-size:12px}.room-usage-panel summary::-webkit-details-marker{display:none}.room-usage-panel summary span{color:#758078;font-weight:400}.room-usage-panel .table-wrap{max-height:340px;overflow:auto}.resource-inventory .table-wrap{max-height:none;overflow-x:auto}.utilization-cell{display:grid;grid-template-columns:70px minmax(60px,110px);gap:8px;align-items:center}.util-track{height:6px;border-radius:8px;background:#edf0ec;overflow:hidden}.util-track b{display:block;height:100%;background:#52805d}.room-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
        gap: 14px;
        align-items: start;
      }
      .room-card {
        padding: 16px;
        min-width: 0;
        overflow: hidden;
      }
      .room-card-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 13px;
      }
      .room-card-head strong {
        font: 700 14px Manrope;
      }
      .room-card-head small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.45;
      }
      .seat-map {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
        padding: 13px;
        background: #f7f9f6;
        border: 1px solid #edf0ec;
        border-radius: 9px;
        min-height: 92px;
      }
      .seat {
        aspect-ratio: 1.2;
        border-radius: 5px;
        border: 1px solid #dce5dc;
        background: white;
        color: #9aa49a;
        display: grid;
        place-items: center;
        font-size: 9px;
        min-width: 0;
      }
      .seat.broken {
        background: #f4e5e1;
        border-style: dashed;
        border-color: #d3a29a;
        color: #9a5148;
        font-weight: 700;
      }
      .seat.occupied {
        background: #dcecdf;
        border-color: #aac8ae;
        color: #28583b;
        font-weight: 700;
      }
      .seat-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: 10px;
        color: #778178;
        margin-top: 10px;
      }
      .legend-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: #dcecdf;
        margin-right: 4px;
      }
      .legend-dot.broken-dot {
        background: #d3a29a;
      }
      .legend-dot.free {
        background: #fff;
        border: 1px solid #dce5dc;
      }
      .search-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .search-input {
        width: min(340px, 55vw);
        border: 1px solid #dce3dc;
        background: #fff;
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--ink);
        outline: none;
      }
      .search-input:focus {
        border-color: #83a38b;
        box-shadow: 0 0 0 3px #e8f1e9;
      }
      .entry-count {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .entry-row {
        display: grid;
        grid-template-columns: minmax(180px, 1.25fr) minmax(
            110px,
            0.9fr
          ) minmax(150px, 1fr) minmax(115px, 0.8fr);
        gap: 12px;
        align-items: center;
        padding: 12px 15px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        min-width: 650px;
      }
      .card:has(> .entry-row) {
        overflow-x: auto;
      }
      .entry-row.head {
        background: #f7f9f6;
        color: #7e897f;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-top: 0;
      }
      .entry-row small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .pager {
        display: flex;
        justify-content: center;
        padding: 14px;
      }
      .tech-note {
        font-size: 11px;
        color: #748076;
        border-top: 1px solid var(--line);
        padding-top: 13px;
        margin-top: 15px;
        line-height: 1.6;
      }
      .calendar-toolbar {
        display: flex;
        gap: 10px;
        align-items: end;
        flex-wrap: wrap;
      }
      .field {
        display: grid;
        gap: 6px;
        font-size: 11px;
        color: #6d796f;
        min-width: 150px;
      }
      .field input,
      .field select,
      .field textarea {

      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">EA</div>
          <span class="brand-name">Exam Allocation</span>
        </div>
        <div class="side-label">WORKSPACE</div>
        <nav class="nav">
          <button class="active" id="nav-home">
            <span class="nav-icon">⌂</span
            ><span class="nav-label">Overview</span></button
          ><button id="nav-data">
            <span class="nav-icon">▤</span
            ><span class="nav-label">Input data</span></button
          ><button id="nav-allocation">
            <span class="nav-icon">▦</span
            ><span class="nav-label">Allocation</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span>Local workspace<br />Files stay in
          this browser
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumb">
            Workspace <span style="color: #c0c7c0">/</span>
            <span id="crumb">Overview</span>
          </div>
          <div class="user">
            <div class="avatar">C</div>
            Coordinator
          </div>
        </header>
        <div class="content"><div id="app"></div></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <script>
      const schemas = {
        exams: {
          title: "Student examination table",
          short: "Student examinations",
          desc: "One row per candidate sitting one paper.",
          required: true,
          fields: [
            "candidate_id",
            "candidate_name",
            "subject",
            "paper",
            "date",
            "start_time",
            "duration_min",
            "extra_time_min",
            "equipment",
          ],
          example:
            "candidate_id,candidate_name,subject,paper,date,start_time,duration_min,extra_time_min,equipment\nC001,Alex Morgan,Mathematics,P1,2026-06-02,09:00,60,0,none",
        },
        rooms: {
          title: "Rooms table",
          short: "Rooms",
          desc: "Room IDs, seat capacity, availability and maintenance status.",
          required: true,
          fields: [
            "room_id",
            "capacity",
            "unusable_seats",
            "available_from",
            "available_to",
            "room_type",
            "status",
            "notes",
          ],
          example:
            "room_id,capacity,unusable_seats,available_from,available_to,room_type,status,notes\nR101,24,0,08:00,16:00,standard,available,\nR102,18,2,08:00,16:00,standard,available,Two broken desks",
        },
        proctors: {
          title: "Proctors table",
          short: "Proctors",
          desc: "Staff IDs, availability and subjects taught.",
          required: true,
          fields: [
            "proctor_id",
            "proctor_name",
            "available_from",
            "available_to",
            "subjects_taught",
          ],
          example:
            "proctor_id,proctor_name,available_from,available_to,subjects_taught\nP01,Jamie Lee,08:00,17:00,none",
        },
        equipment: {
          title: "Equipment table",
          short: "Equipment",
          desc: "Equipment type and available quantity.",
          required: true,
          fields: ["equipment_type", "quantity"],
          example: "equipment_type,quantity\nlaptop,12\nassistive_technology,2",
        },
      };
      const data = {};
      let page = "setup",
        view = "room",
        allocation = [];
      const app = document.querySelector("#app");
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function parseCSV(text) {
        const rows = [];
        let row = [],
          cell = "",
          quoted = false;
        for (let i = 0; i < text.length; i++) {
          let c = text[i];
          if (c === '"') {
            if (quoted && text[i + 1] === '"') {
              cell += '"';
              i++;
            } else quoted = !quoted;
          } else if (c === "," && !quoted) {
            row.push(cell.trim());
            cell = "";
          } else if ((c === "\n" || c === "\r") && !quoted) {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell.trim());
            if (row.some((x) => x !== "")) rows.push(row);
            row = [];
            cell = "";
          } else cell += c;
        }
        row.push(cell.trim());
        if (row.some((x) => x !== "")) rows.push(row);
        if (!rows.length) return { headers: [], records: [] };
        const headers = rows
          .shift()
          .map((x) => x.toLowerCase().replace(/^\uFEFF/, ""));
        return {
          headers,
          records: rows.map((r) =>
            Object.fromEntries(headers.map((h, i) => [h, r[i] ?? ""])),
          ),
        };
      }
      function normalizeRoomData(kind, parsed) {
        // Keep browser validation in step with the Flask upload defaults.
        const defaults = kind === "rooms"
          ? { unusable_seats: "0", status: "available", notes: "" }
          : kind === "exams"
            ? { extra_time_min: "0", equipment: "none", rest_break_min: "0" }
            : {};
        for (const [field, value] of Object.entries(defaults)) {
          if (!parsed.headers.includes(field)) {
            parsed.headers.push(field);
            parsed.records.forEach((row) => (row[field] = value));
          }
        }
        return parsed;
      }
      function validate() {
        const all = [];
        const tableErrors = {};
        const booleanValues = new Set([
          "1", "0", "true", "false", "yes", "no", "y", "n", "required", "none",
        ]);
        const normal = (value) => String(value ?? "").trim().toLowerCase();
        const whole = (value, allowZero = false) => {
          if (String(value ?? "").trim() === "") return false;
          const number = Number(value);
          return Number.isFinite(number) && Number.isInteger(number) && (allowZero ? number >= 0 : number > 0);
        };
        const validDate = (value) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return false;
          const parsed = new Date(`${value}T00:00:00Z`);
          return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value;
        };

        for (const [key, schema] of Object.entries(schemas)) {
          const table = data[key];
          if (!table) continue;
          const issues = [];
          const duplicateHeaders = new Set();
          for (const header of table.headers) {
            if (duplicateHeaders.has(header)) issues.push({ row: 1, msg: `Duplicate column name “${header}”.` });
            duplicateHeaders.add(header);
          }
          const missing = schema.fields.filter((field) => !table.headers.includes(field));
          for (const field of missing) issues.push({ row: 1, msg: `Missing required column “${field}”.` });
          if (missing.length) {
            table.errors = issues;
            tableErrors[key] = issues;
            all.push(...issues.map((issue) => ({ ...issue, file: schema.short })));
            continue;
          }
          if (!table.records.length) issues.push({ row: 1, msg: "At least one data row is required." });

          const keyRows = new Map();
          const sessions = new Map();
          table.records.forEach((row, index) => {
            const line = index + 2;
            const required = key === "exams"
              ? ["candidate_id", "candidate_name", "subject", "paper", "date", "start_time", "duration_min"]
              : key === "rooms"
                ? ["room_id", "capacity", "available_from", "available_to", "room_type", "status"]
                : key === "proctors"
                  ? ["proctor_id", "proctor_name", "available_from", "available_to", "subjects_taught"]
                  : ["equipment_type", "quantity"];
            for (const field of required) {
              if (!String(row[field] ?? "").trim()) issues.push({ row: line, msg: `${field} is required.` });
            }

            let keyValue = "";
            if (key === "exams") keyValue = [row.candidate_id, row.subject, row.paper, row.date].map(normal).join("|");
            else if (key === "rooms") keyValue = normal(row.room_id);
            else if (key === "proctors") keyValue = normal(row.proctor_id);
            else keyValue = normal(row.equipment_type);
            if (keyValue) {
              if (!keyRows.has(keyValue)) keyRows.set(keyValue, []);
              keyRows.get(keyValue).push(line);
            }

            if (key === "exams") {
              if (!validDate(String(row.date || "").trim())) issues.push({ row: line, msg: "date must be a real YYYY-MM-DD date." });
              const startValid = timeOK(row.start_time);
              if (!startValid) issues.push({ row: line, msg: "start_time must be a valid 24-hour HH:MM time." });
              if (!whole(row.duration_min)) issues.push({ row: line, msg: "duration_min must be a positive whole number of minutes." });
              if (!whole(row.extra_time_min || "0", true)) issues.push({ row: line, msg: "extra_time_min must be zero or a positive whole number." });
              if (!whole(row.rest_break_min || "0", true)) issues.push({ row: line, msg: "rest_break_min must be zero or a positive whole number." });
              if (startValid && whole(row.duration_min) && whole(row.extra_time_min || "0", true) && whole(row.rest_break_min || "0", true)) {
                if (min(row.start_time) + Number(row.duration_min) + Number(row.extra_time_min || 0) + Number(row.rest_break_min || 0) > 1440) {
                  issues.push({ row: line, msg: "The sitting, extra time and rest-break allowance must finish by midnight." });
                }
                const sessionKey = JSON.stringify([
                  String(row.date || "").trim(), normal(row.subject), normal(row.paper), min(row.start_time),
                ]);
                if (!sessions.has(sessionKey)) sessions.set(sessionKey, []);
                sessions.get(sessionKey).push({ line, duration: Number(row.duration_min) });
              }
              for (const field of ["separate_room", "reader", "scribe"]) {
                const value = normal(row[field]);
                if (value && !booleanValues.has(value)) issues.push({ row: line, msg: `${field} must be a yes/no or true/false value.` });
              }
            }

            if (key === "rooms") {
              if (!whole(row.capacity)) issues.push({ row: line, msg: "capacity must be a positive whole number of seats." });
              if (!whole(row.unusable_seats || "0", true) || (whole(row.capacity) && Number(row.unusable_seats || 0) > Number(row.capacity))) {
                issues.push({ row: line, msg: "unusable_seats must be a whole number from zero to capacity." });
              }
              if (!["available", "maintenance", "unusable"].includes(normal(row.status))) issues.push({ row: line, msg: "status must be available, maintenance or unusable." });
            }

            if (["rooms", "proctors"].includes(key)) {
              const fromValid = timeOK(row.available_from), toValid = timeOK(row.available_to);
              if (!fromValid) issues.push({ row: line, msg: "available_from must be a valid 24-hour HH:MM time." });
              if (!toValid) issues.push({ row: line, msg: "available_to must be a valid 24-hour HH:MM time." });
              if (fromValid && toValid && min(row.available_from) >= min(row.available_to)) {
                issues.push({ row: line, msg: "Availability must finish after it starts; overnight availability is not supported." });
              }
            }
            if (key === "equipment" && !whole(row.quantity, true)) issues.push({ row: line, msg: "quantity must be a whole number of zero or greater." });
          });

          for (const [duplicate, lines] of keyRows) {
            if (lines.length > 1) {
              for (const line of lines) issues.push({ row: line, msg: `Duplicate identifier/key “${duplicate}” (case-insensitive).` });
            }
          }
          for (const members of sessions.values()) {
            if (new Set(members.map((member) => member.duration)).size > 1) {
              for (const member of members) issues.push({ row: member.line, msg: "Candidates in the same paper sitting must share duration_min; use extra_time_min for individual extra time." });
            }
          }
          table.errors = issues;
          tableErrors[key] = issues;
          all.push(...issues.map((issue) => ({ ...issue, file: schema.short })));
        }

        // Equipment cross-checks are deferred until both tables exist, so users
        // can upload the four CSVs in any order.
        if (data.exams && data.equipment) {
          const allowed = new Set(data.equipment.records.map((row) => normal(row.equipment_type)));
          data.exams.records.forEach((row, index) => {
            const line = index + 2;
            const requested = normal(row.equipment || "none");
            if (requested && !["none", "n/a", "na", "null"].includes(requested) && !allowed.has(requested)) {
              const issue = { row: line, msg: `Equipment type “${row.equipment}” is not listed in the equipment table.` };
              (tableErrors.exams ||= []).push(issue);
              all.push({ ...issue, file: schemas.exams.short });
            }
            for (const field of ["reader", "scribe"]) {
              if (["1", "true", "yes", "y", "required"].includes(normal(row[field])) && !allowed.has(field)) {
                const issue = { row: line, msg: `A student requires ${field} support, but no “${field}” equipment type is listed.` };
                (tableErrors.exams ||= []).push(issue);
                all.push({ ...issue, file: schemas.exams.short });
              }
            }
          });
          data.exams.errors = tableErrors.exams || [];
        }
        return all;
      }
      function timeOK(t) {
        return (
          /^\d{1,2}:\d\d$/.test(t || "") &&
          Number(t.split(":")[0]) < 24 &&
          Number(t.split(":")[1]) < 60
        );
      }
      function min(t) {
        let [a, b] = t.split(":").map(Number);
        return a * 60 + b;
      }
      function clock(n) {
        return (
          String(Math.floor(n / 60) % 24).padStart(2, "0") +
          ":" +
          String(n % 60).padStart(2, "0")
        );
      }
      function complete() {
        return Object.keys(schemas).every((k) => data[k]);
      }
      function errors() {
        return validate();
      }
      function go(p) {
        page = p;
        render();
      }
      function render() {
        document.querySelector("#crumb").textContent =
          page === "setup"
            ? "Overview"
            : page === "data"
              ? "Input data"
              : "Allocation";
        document
          .querySelectorAll(".nav button")
          .forEach((b) => b.classList.remove("active"));
        document
          .querySelector("#nav-" + (page === "setup" ? "home" : page))
          .classList.add("active");
        app.innerHTML =
          page === "setup"
            ? setup()
            : page === "data"
              ? dataPage()
              : allocationPage();
      }
      function setup() {
        let ready = complete(),
          issues = ready ? errors() : [];
        if (!ready)
          return `<div class="eyebrow">EXAMINATION COORDINATOR DASHBOARD</div><h1>Let’s set up your examination schedule.</h1><p class="lead">Bring your examination data and available resources together. We’ll check everything before creating an allocation.</p>${stepper(1)}<div class="section-head"><div><h2>Your input tables</h2><p>Upload each CSV to get started. One exam row represents one candidate sitting one paper.</p></div></div><div class="grid">${Object.entries(
            schemas,
          )
            .map(([k, s]) => uploadCard(k, s))
            .join(
              "",
            )}</div><div class="hint"><strong>Start with four CSV files.</strong> Each file is checked in your browser. You’ll see the row number and reason for any issues, then can correct the file and upload it again. <a href="#" onclick="showSchema();return false" style="color:#35664b;font-weight:700">View CSV format</a></div><div class="actions"><button class="btn primary" disabled>Validate data <span>→</span></button></div>`;
        return `<div class="eyebrow">EXAMINATION COORDINATOR DASHBOARD</div><h1>Data overview</h1><p class="lead">Review your uploaded tables. Resolve any errors before generating an allocation.</p>${stepper(2)}<div class="metric-row"><div class="card metric"><label>Candidates</label><strong>${new Set(data.exams.records.map((r) => r.candidate_id)).size}</strong><span>From examination table</span></div><div class="card metric"><label>Exam entries</label><strong>${data.exams.records.length}</strong><span>Candidate paper sittings</span></div><div class="card metric"><label>Rooms available</label><strong>${data.rooms.records.filter((r) => (r.status || "available").toLowerCase() === "available").length}</strong><span>Operational rooms · ${data.rooms.records.length} total</span></div><div class="card metric"><label>Proctors available</label><strong>${data.proctors.records.length}</strong><span>Uploaded staff</span></div></div><div class="section-head"><div><h2>Validation summary</h2><p>All four tables must be valid before allocation.</p></div></div><div class="validation-list">${Object.entries(
          schemas,
        )
          .map(([k, s]) => {
            let d = data[k],
              n = d.errors?.length || 0;
            return `<div class="card validation-row"><div class="validation-left"><span class="check">${n ? "!" : "✓"}</span><div><strong>${s.title}</strong><div style="font-size:11px;color:#818b82;margin-top:3px">${d.records.length} rows · ${esc(d.fileName)}</div></div></div><span class="badge ${n ? "error" : "valid"}">${n ? `${n} issue${n > 1 ? "s" : ""}` : "Valid"}</span></div>`;
          })
          .join(
            "",
          )}</div>${issues.length ? `<div class="card issues" style="margin-top:14px"><strong style="color:#954c45">Fix these rows and upload the corrected file.</strong>${issues.map((e) => `<div class="issue-line">${esc(e.file)} · row ${e.row}: ${esc(e.msg)}</div>`).join("")}</div>` : ""}<div class="actions"><button class="btn" onclick="go('data')">Manage data</button><button class="btn primary" onclick="generate()" ${issues.length ? "disabled" : ""}>Generate allocation →</button></div>`;
      }
      function stepper(n) {
        return `<div class="stepper"><div class="step ${n === 1 ? "on" : "done"}"><b>${n > 1 ? "✓" : "1"}</b> Upload tables</div><div class="step ${n === 2 ? "on" : ""}"><b>2</b> Validate data</div><div class="step"><b>3</b> Allocate resources</div></div>`;
      }
      function uploadCard(k, s) {
        let d = data[k],
          issue = d?.errors?.length;
        return `<label class="card upload-card" style="cursor:pointer"><div class="file-icon">CSV</div><div class="upload-info"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${s.title}</h3><span class="badge ${d ? (issue ? "error" : "loaded") : "required"}">${d ? (issue ? "Needs attention" : "Uploaded") : "Required"}</span></div><p>${s.desc}</p>${d ? `<span class="file-name">${esc(d.fileName)} · ${d.records.length} rows${issue ? ` · ${issue} issues` : ""}</span>` : ""}<input type="file" accept=".csv,text/csv" hidden onchange="upload('${k}',this.files[0])"></div></label>`;
      }
      function dataPage() {
        return `<div class="eyebrow">INPUT DATA</div><h1>Manage your tables</h1><p class="lead">Upload and inspect the source records used to build the schedule.</p><div class="grid">${Object.entries(
          schemas,
        )
          .map(([k, s]) => uploadCard(k, s))
          .join(
            "",
          )}</div><div class="section-head"><div><h2>Validation details</h2><p>Errors include source row numbers so you can correct the right records.</p></div><button class="btn" onclick="showSchema()">CSV format</button></div>${
          Object.keys(data).length
            ? Object.entries(schemas)
                .filter(([k]) => data[k])
                .map(([k, s]) => {
                  let d = data[k],
                    errs = d.errors || [];
                  return `<div class="card" style="margin-bottom:13px"><div style="padding:15px 17px;display:flex;justify-content:space-between"><strong>${s.title}</strong><span class="badge ${errs.length ? "error" : "valid"}">${errs.length ? `${errs.length} issues` : "Valid"}</span></div>${
                    errs.length
                      ? `<div class="issues" style="border-radius:0 0 12px 12px">${errs.map((e) => `<div class="issue-line">Row ${e.row}: ${esc(e.msg)}</div>`).join("")}</div>`
                      : `<div class="table-wrap"><table class="data-table"><thead><tr>${d.headers.map((x) => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${d.records
                          .slice(0, 8)
                          .map(
                            (r) =>
                              `<tr>${d.headers.map((h) => `<td>${esc(r[h])}</td>`).join("")}</tr>`,
                          )
                          .join(
                            "",
                          )}</tbody></table>${d.records.length > 8 ? `<div class="footer-note" style="padding:0 14px 12px">Showing 8 of ${d.records.length} rows</div>` : ""}</div>`
                  }</div>`;
                })
                .join("")
            : `<div class="card empty">Upload a CSV above to inspect its rows and validation results.</div>`
        }<div class="actions"><button class="btn primary" onclick="go('setup')">Back to overview →</button></div>`;
      }
      function allocationPage() {
        if (!allocation.length)
          return `<div class="eyebrow">ALLOCATION WORKSPACE</div><h1>Allocation</h1><p class="lead">Your proposed bookings will appear here after allocation.</p><div class="card empty">No allocation has been generated yet.<br><button class="btn primary" style="margin-top:16px" onclick="go('setup')">Review input data</button></div>`;
        let list =
          view === "room"
            ? allocation
            : view === "candidate"

                  updated.set(next, proposed);
              }
              states = updated;
            }
            const covering = [...states]
              .filter(([total, chosen]) => chosen.length && total >= demand)
              .sort(
                (a, b) =>
                  a[1].length - b[1].length ||
                  a[0] - demand - (b[0] - demand) ||
                  a[1]
                    .map((x) => x.room_id)
                    .sort()
                    .join("|")
                    .localeCompare(
                      b[1]
                        .map((x) => x.room_id)
                        .sort()
                        .join("|"),
                    ),
              );
            if (covering.length) return covering[0][1];
            return [...states].sort(
              (a, b) => b[0] - a[0] || a[1].length - b[1].length,
            )[0][1];
          };
          sessionValues.sort(
            (a, b) =>
              staffFor(a).length - staffFor(b).length ||
              roomsFor(a).reduce((n, r) => n + roomCapacity(r), 0) -
                roomsFor(b).reduce((n, r) => n + roomCapacity(r), 0) ||
              pressure(b) - pressure(a) ||
              b.rows.length - a.rows.length ||
              a.date.localeCompare(b.date) ||
              a.start - b.start ||
              a.subject.localeCompare(b.subject),
          );
          const roomBookings = {},
            staffBookings = {},
            equipmentBookings = {};
          for (const s of sessionValues) {
            const pending = [...s.rows].sort((a, b) => {
              const type = (x) => (x.equipment || "none").trim().toLowerCase(),
                qa = Math.max(
                  1,
                  (stock[type(a)] || 999999) - (equipmentReserve[type(a)] || 0),
                ),
                qb = Math.max(
                  1,
                  (stock[type(b)] || 999999) - (equipmentReserve[type(b)] || 0),
                );
              return (
                (type(a) === "none" ? 0 : -1 / qa) -
                  (type(b) === "none" ? 0 : -1 / qb) ||
                a.candidate_id.localeCompare(b.candidate_id)
              );
            });
            while (pending.length) {
              const current = Object.entries(roomBookings).flatMap(
                ([id, bookings]) =>
                  bookings.filter(
                    (b) =>
                      b.session === s.key &&
                      b.seats.length < roomCapacity(b.room),
                  ),
              );
              let booking = current.sort(
                (a, b) =>
                  b.seats.length / roomCapacity(b.room) -
                  a.seats.length / roomCapacity(a.room),
              )[0];
              if (!booking) {
                const free = roomsFor(s).filter(
                  (r) =>
                    !(roomBookings[r.room_id] || []).some(
                      (b) =>
                        b.date === s.date &&
                        overlap(s.start, s.end, b.start, b.end),
                    ),
                );
                if (!free.length) {
                  const e = pending.shift();
                  e.reason_codes.push("room_capacity_or_availability");
                  e.equipment_status = "not_allocated_room";
                  continue;
                }
                const eligible = staffFor(s).filter(
                  (p) =>
                    !(staffBookings[p.proctor_id] || []).some(
                      (b) =>
                        b.date === s.date &&
                        overlap(s.start, s.end, b.start, b.end),
                    ),
                );
                eligible.sort(
                  (a, b) =>
                    min(a.available_to) -
                      min(a.available_from) -
                      (min(b.available_to) - min(b.available_from)) ||
                    a.proctor_id.localeCompare(b.proctor_id),
                );
                if (!eligible.length) {
                  pending.forEach((e) =>
                    e.reason_codes.push("no_eligible_proctor_for_room"),
                  );
                  break;
                }
                const roomSet = chooseRoomSet(
                  free,
                  pending.length,
                  eligible.length,
                );
                const room = roomSet.sort(
                  (a, b) =>
                    roomCapacity(b) - roomCapacity(a) ||
                    a.room_id.localeCompare(b.room_id),
                )[0];
                const proctor = eligible[0];
                booking = {
                  session: s.key,
                  date: s.date,
                  start: s.start,
                  end: s.end,
                  room,
                  seats: [],
                  proctor,
                };
                (roomBookings[room.room_id] ??= []).push(booking);
                if (proctor)
                  (staffBookings[proctor.proctor_id] ??= []).push({
                    date: s.date,
                    start: s.start,
                    end: s.end,
                    room_id: room.room_id,
                    session: s.key,
                    subject: s.subject,
                  });
              }
              const e = pending.shift();
              e.room_id = booking.room.room_id;
              e.room_capacity = roomCapacity(booking.room);
              e.room_total_capacity = Number(booking.room.capacity);
              e.room_unusable_seats = Number(booking.room.unusable_seats) || 0;
              e.seat = booking.seats.length + 1;
              booking.seats.push(e._index);
              if (booking.proctor) {
                e.proctor_id = booking.proctor.proctor_id;
                e.proctor_name = booking.proctor.proctor_name;
              } else e.reason_codes.push("no_eligible_proctor_for_room");
              const kind = (e.equipment || "none").trim().toLowerCase();
              if (kind === "none") e.equipment_status = "not_required";
              else {
                const usable = Math.max(
                  0,
                  (stock[kind] || 0) - (equipmentReserve[kind] || 0),
                );
                if (equipmentCanFit(kind, e.date, e.start, e.end, usable)) {
                  (equipmentBookings[kind] ??= []).push({
                    date: e.date,
                    start: e.start,
                    end: e.end,
                    candidate_id: e.candidate_id,
                  });
                  e.equipment_status = "assigned";
                } else {
                  e.equipment_available = false;
                  e.equipment_status = "quantity_shortage";
                  e.reason_codes.push("equipment_quantity");
                }
              }
            }
          }
          const independent = [];
          for (const [id, bookings] of Object.entries(roomBookings)) {
            for (let i = 0; i < bookings.length; i++) {
              const b = bookings[i];
              if (b.seats.length > roomCapacity(b.room))
                independent.push({ resource: id, issue: "capacity_exceeded" });
              if ((b.room.status || "available").toLowerCase() !== "available")
                independent.push({
                  resource: id,
                  issue: "room_not_operational",
                });
              if (
                min(b.room.available_from) > b.start ||
                min(b.room.available_to) < b.end
              )
                independent.push({
                  resource: id,
                  issue: "outside_room_availability",
                });
              for (const other of bookings.slice(i + 1))
                if (
                  b.session !== other.session &&
                  b.date === other.date &&
                  overlap(b.start, b.end, other.start, other.end)
                )
                  independent.push({
                    resource: id,
                    issue: "overlapping_room_bookings",
                  });
            }
          }
          for (const [id, bookings] of Object.entries(staffBookings)) {
            const person = data.proctors.records.find(
              (p) => p.proctor_id === id,
            );
            for (const b of bookings) {
              if (
                min(person.available_from) > b.start ||
                min(person.available_to) < b.end
              )
                independent.push({
                  resource: id,
                  issue: "outside_proctor_availability",
                });
              if (taught(person).includes((b.subject || "").toLowerCase()))
                independent.push({
                  resource: id,
                  issue: "proctor_teaches_exam_subject",
                });
            }
            for (let i = 0; i < bookings.length; i++)
              for (const other of bookings.slice(i + 1))
                if (
                  bookings[i].date === other.date &&
                  overlap(
                    bookings[i].start,
                    bookings[i].end,
                    other.start,
                    other.end,
                  )
                )
                  independent.push({
                    resource: id,
                    issue: "overlapping_proctor_duties",
                  });
          }
          for (const [kind, qty] of Object.entries(stock)) {
            const limit = Math.max(0, qty - (equipmentReserve[kind] || 0)),
              days = {};
            exams
              .filter(
                (e) =>
                  e.equipment_available &&
                  e.equipment_status === "assigned" &&
                  (e.equipment || "none").trim().toLowerCase() === kind,
              )
              .forEach((e) =>
                (days[e.date] ??= []).push([e.start, 1], [e.end, -1]),
              );
            for (const [date, events] of Object.entries(days)) {
              let active = 0;
              for (const [time, delta] of events.sort(
                (a, b) => a[0] - b[0] || a[1] - b[1],
              )) {
                active += delta;
                if (active > limit) {
                  independent.push({
                    resource: kind,
                    issue: "equipment_quantity_exceeded",
                    date,
                  });
                  break;
                }
              }
            }
          }
          exams.forEach((e) => {
            if (e.candidate_conflict) {
              e.assignment_status = "unassigned";
              e.reason_codes.push("student_overlap");
            } else if (e.room_id && e.proctor_id && e.equipment_available)
              e.assignment_status = "allocated";
            else if (e.room_id) e.assignment_status = "partial";
            else e.assignment_status = "unassigned";
            e.start_minute = e.start;
            e.end_minute = e.end;
            // Keep the local preview's field names aligned with the Flask API
            // so the same UI status, filter and recovery logic works in both.
            e.equipment_ok = Boolean(e.equipment_available);
            e.student_conflict = Boolean(e.candidate_conflict);
            e.room_reason = e.reason_codes.includes(
              "room_capacity_or_availability",
            )
              ? "room_capacity_or_availability"
              : null;
            e.proctor_reason = e.reason_codes.includes(
              "no_eligible_proctor_for_room",
            )
              ? "no_eligible_proctor_for_room"
              : null;
          });
          const unresolved = exams.filter(
            (e) => e.assignment_status !== "allocated",
          ).length;
          allocationMeta = {
            reserve: {
              room: reservedRoom
                ? {
                    room_id: reservedRoom.room_id,
                    capacity: roomCapacity(reservedRoom),
                    total_capacity: Number(reservedRoom.capacity),
                    unusable_seats: Number(reservedRoom.unusable_seats) || 0,
                  }
                : null,
              proctor: reservedProctor
                ? {
                    proctor_id: reservedProctor.proctor_id,
                    proctor_name: reservedProctor.proctor_name,
                  }
                : null,
              equipment: equipmentReserve,
            },
            rooms_used: Object.keys(roomBookings).length,
            operational_rooms: operational.length,
            room_bookings: Object.values(roomBookings).reduce(
              (n, x) => n + x.length,
              0,
            ),
            proctor_bookings: Object.values(staffBookings).reduce(
              (n, x) => n + x.length,
              0,
            ),
            independent_check_issues: independent,
            method:
              "most-constrained-first; equipment scarcity first; least-waste subset-sum room packing bounded by available proctors; one proctor per room booking; independent overlap and capacity checks",
          };
          allocation = exams;
          visibleCount = 20;
          allocationSearch = "";
          view = "room";
          page = "allocation";
          appNotice =
            unresolved || independent.length
              ? {
                  message: `Allocation review: ${unresolved} entries need attention${independent.length ? ` and ${independent.length} independent check issue(s) were detected` : ""}. See suggested recovery steps.`,
                  type: "error",
                }
              : {
                  message:
                    "Allocation completed and passed the independent checks. Contingency resources are shown below.",
                  type: "success",
                };
          render();
        } catch (e) {
          console.error(e);
          setNotice(
            `Allocation engine failed: ${e.message || "unexpected error"}. Check the input tables and retry.`,
          );
          render();
        }
      }
      function roomUtilizationPanel() {
        const reserveRoomId = String(allocationMeta.reserve?.room?.room_id ?? "").trim().toLowerCase();
        const rooms = (data.rooms?.records || []).map((room) => {
          const roomId = String(room.room_id ?? "").trim();
          const roomKey = roomId.toLowerCase();
          const unusable = Math.max(0, Number(room.unusable_seats) || 0);
          const capacity = Math.max(0, Number(room.capacity) || 0);
          const usable = Math.max(0, capacity - unusable);
          const byBooking = new Map();
          allocation.filter((entry) => String(entry.room_id ?? "") === roomId).forEach((entry) => {
            const key = [entry.date, entry.subject, entry.paper, entry.start ?? entry.start_minute].join("|");
            if (!byBooking.has(key)) byBooking.set(key, { date: entry.date, start: Number(entry.start ?? entry.start_minute) || 0, end: Number(entry.end ?? entry.end_minute) || 0, seats: 0 });
            const booking = byBooking.get(key);
            booking.end = Math.max(booking.end, Number(entry.end ?? entry.end_minute) || 0);
            booking.seats += 1;
          });
          const bookings = [...byBooking.values()];
          const events = [];
          bookings.forEach((booking) => {
            events.push({ date: booking.date, time: booking.start, delta: booking.seats });
            events.push({ date: booking.date, time: booking.end, delta: -booking.seats });
          });
          events.sort((a, b) => a.date.localeCompare(b.date) || a.time - b.time || a.delta - b.delta);
          let active = 0, peak = 0, activeDate = null;
          events.forEach((event) => {
            if (event.date !== activeDate) { active = 0; activeDate = event.date; }
            active += event.delta;
            peak = Math.max(peak, active);
          });
          const rawStatus = String(room.status || "available").trim().toLowerCase();
          const held = reserveRoomId && roomKey === reserveRoomId;
          const state = rawStatus !== "available"
            ? (room.status || "Unavailable")
            : usable === 0
              ? "No usable seats"
              : held
                ? "Held in reserve"
                : bookings.length
                  ? "Used"
                  : "Empty / available";
          const percent = usable ? Math.min(100, Math.round(peak * 100 / usable)) : 0;
          return { roomId, capacity, unusable, usable, bookings: bookings.length, peak, state, percent };
        });
        const usedCount = rooms.filter((room) => room.bookings > 0).length;
        const emptyCount = rooms.filter((room) => room.state === "Empty / available").length;
        const reservedCount = rooms.filter((room) => room.state === "Held in reserve").length;
        return `<details class="card room-usage-panel resource-inventory"><summary><strong>Room inventory &amp; empty rooms</strong><span>${emptyCount} empty · ${reservedCount} held in reserve · ${usedCount} used · ${rooms.length} total</span></summary><div class="table-wrap"><table class="data-table"><thead><tr><th>Room</th><th>Usable / installed seats</th><th>Bookings</th><th>Peak concurrent seating</th><th>Status</th></tr></thead><tbody>${rooms.map((room) => `<tr><td><strong>${esc(room.roomId)}</strong></td><td>${room.usable} / ${room.capacity}${room.unusable ? ` · ${room.unusable} unavailable` : ""}</td><td>${room.bookings}</td><td><div class="utilization-cell"><span>${room.peak} / ${room.usable}</span><i class="util-track"><b style="width:${room.percent}%"></b></i></div></td><td><span class="status-pill ${room.state === "Used" ? "allocated" : room.state === "Empty / available" ? "" : room.state === "Held in reserve" ? "partial" : "unassigned"}">${esc(room.state)}</span></td></tr>`).join("") || `<tr><td colspan="5">No room records are loaded.</td></tr>`}</tbody></table></div><p class="footer-note">Every room from the uploaded room table is listed, including rooms never used by this schedule, rooms held as contingency, and rooms unavailable for operational reasons. Rooms can be reused after a booking ends.</p></details>`;
      }

        const bookingsByProctor = new Map();
        allocation.forEach((entry) => {

          if (!id || !entry.room_id) return;
