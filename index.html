      }

      function equipmentInventoryPanel() {
        const normalize = (value) => String(value ?? "").trim().toLowerCase();
        const reserveMap = allocationMeta.reserve?.equipment || {};
        const reserveFor = (kind) => {
          const key = normalize(kind);
          const match = Object.entries(reserveMap).find(([name]) => normalize(name) === key);
          return Math.max(0, Number(match?.[1]) || 0);
        };
        const eventsByKind = new Map();
        const requestCountByKind = new Map();
        const shortageCountByKind = new Map();
        allocation.forEach((entry) => {
          const assignedKinds = Array.isArray(entry.equipment_allocations) && entry.equipment_allocations.length
            ? entry.equipment_allocations.map(normalize).filter((kind) => kind && !["none", "n/a", "na", "null"].includes(kind))
            : (String(entry.equipment_status ?? "") === "assigned" && !["", "none", "n/a", "na", "null"].includes(normalize(entry.equipment)) ? [normalize(entry.equipment)] : []);
          const uniqueAssigned = [...new Set(assignedKinds)];
          uniqueAssigned.forEach((kind) => {
            requestCountByKind.set(kind, (requestCountByKind.get(kind) || 0) + 1);
            if (!eventsByKind.has(kind)) eventsByKind.set(kind, []);
            const start = Number(entry.start ?? entry.start_minute);
            const end = Number(entry.end ?? entry.end_minute);
            if (Number.isFinite(start) && Number.isFinite(end) && end > start) {
              eventsByKind.get(kind).push({ date: String(entry.date ?? ""), time: start, delta: 1 });
              eventsByKind.get(kind).push({ date: String(entry.date ?? ""), time: end, delta: -1 });
            }
          });
          const missingKinds = Array.isArray(entry.missing_equipment) && entry.missing_equipment.length
            ? entry.missing_equipment.map(normalize)
            : (String(entry.equipment_status ?? "") === "quantity_shortage" ? [normalize(entry.equipment)].filter((kind) => kind && !["none", "n/a", "na", "null"].includes(kind)) : []);
          [...new Set(missingKinds)].forEach((kind) => shortageCountByKind.set(kind, (shortageCountByKind.get(kind) || 0) + 1));
        });
        const inventory = (data.equipment?.records || []).map((item) => {
          const type = String(item.equipment_type ?? "").trim();
          const key = normalize(type);
          const quantity = Math.max(0, Number(item.quantity) || 0);
          const reserved = Math.min(quantity, reserveFor(type));
          const operational = Math.max(0, quantity - reserved);
          const events = [...(eventsByKind.get(key) || [])].sort((a, b) => a.date.localeCompare(b.date) || a.time - b.time || a.delta - b.delta);
          let active = 0, peak = 0, activeDate = null;
          events.forEach((event) => {
            if (event.date !== activeDate) { active = 0; activeDate = event.date; }
            active += event.delta;
            peak = Math.max(peak, active);
          });
          const spare = Math.max(0, operational - peak);
          const shortages = shortageCountByKind.get(key) || 0;
          const state = shortages ? "Shortage detected" : spare > 0 ? "Spare stock available" : peak > 0 ? "Fully used at peak" : reserved ? "Held in reserve" : "Not requested";
          return { type, quantity, reserved, operational, peak, spare, requests: requestCountByKind.get(key) || 0, shortages, state };
        });
        const spareUnits = inventory.reduce((total, item) => total + item.spare, 0);
        const reservedUnits = inventory.reduce((total, item) => total + item.reserved, 0);
        const shortageTypes = inventory.filter((item) => item.shortages > 0).length;
        return `<details class="card room-usage-panel resource-inventory"><summary><strong>Equipment inventory &amp; spare stock</strong><span>${spareUnits} spare units at peak · ${reservedUnits} held in reserve · ${shortageTypes} type(s) with shortages</span></summary><div class="table-wrap"><table class="data-table"><thead><tr><th>Equipment type</th><th>Total quantity</th><th>Held in reserve</th><th>Usable by schedule</th><th>Peak concurrent use</th><th>Spare at peak</th><th>Requests assigned / shortage</th><th>Status</th></tr></thead><tbody>${inventory.map((item) => `<tr><td><strong>${esc(item.type)}</strong></td><td>${item.quantity}</td><td>${item.reserved}</td><td>${item.operational}</td><td>${item.peak} / ${item.operational}</td><td><strong>${item.spare}</strong></td><td>${item.requests}${item.shortages ? ` / <span style="color:var(--red)">${item.shortages} short</span>` : ""}</td><td><span class="status-pill ${item.shortages ? "unassigned" : item.spare > 0 || item.state === "Not requested" ? "allocated" : item.reserved ? "partial" : ""}">${esc(item.state)}</span></td></tr>`).join("") || `<tr><td colspan="8">No equipment inventory records are loaded.</td></tr>`}</tbody></table></div><p class="footer-note">“Spare at peak” is the quantity outside the protected reserve after subtracting the highest simultaneous assigned use for each equipment type. Equipment can be reused by non-overlapping sittings. Support requirements such as readers and scribes are included when the allocation engine reports them in equipment_allocations.</p></details>`;
      }

      function allocationPage() {
        if (!allocation.length)
          return `<div class="eyebrow">ALLOCATION WORKSPACE</div><h1>Allocation</h1><p class="lead">Generate a plan to view seat assignments, contingency reserves, and unresolved constraints.</p><div class="card empty">No allocation has been generated yet.<br><button class="btn primary" style="margin-top:16px" onclick="go('setup')">Review data and generate</button></div>${reserveControls()}`;
        const statusOf = (a) =>
            a.assignment_status ||
            (a.room_id && a.proctor_id && a.equipment_ok
              ? "allocated"
              : a.room_id
                ? "partial"
                : "unassigned"),
          q = allocationSearch.trim().toLowerCase(),
          normalizeEquipment = (value) => String(value ?? "").trim().toLowerCase(),
          isRequestedFlag = (value) => [true, 1].includes(value) || ["1", "true", "yes", "y"].includes(normalizeEquipment(value)),
          equipmentKindsFor = (entry) => {
            const kinds = new Set();
            const add = (value) => {
              const kind = normalizeEquipment(value);
              if (kind && !["none", "n/a", "na", "null", "", "false", "0"].includes(kind)) kinds.add(kind);
            };
            (Array.isArray(entry.equipment_allocations) ? entry.equipment_allocations : []).forEach(add);
            (Array.isArray(entry.missing_equipment) ? entry.missing_equipment : []).forEach(add);
            add(entry.equipment);
            if (isRequestedFlag(entry.reader)) add("reader");
            if (isRequestedFlag(entry.scribe)) add("scribe");
            return [...kinds];
          },
          filtered = allocation.filter((a) =>
            [
              a.room_id,
              a.candidate_id,
              a.candidate_name,
              a.proctor_id,
              a.proctor_name,
              a.subject,
              a.paper,
              a.equipment,
              a.equipment_status,
              a.reader,
              a.scribe,
              ...(Array.isArray(a.equipment_allocations) ? a.equipment_allocations : []),
              ...(Array.isArray(a.missing_equipment) ? a.missing_equipment : []),
            ].some((v) => String(v || "").toLowerCase().includes(q)),
          ),
          unresolved = allocation.filter(
            (a) => statusOf(a) !== "allocated" || a.student_conflict,
          ),
          allocatedCount = allocation.length - unresolved.length,
          checks = allocationMeta.independent_check_issues || [],
          staffingDiagnostics = allocationMeta.staffing_diagnostics || [];
        const unresolvedReason = (a) => {
          const reasons = a.reason_codes || [];
          if (a.student_conflict || reasons.includes("student_overlap")) return "overlapping papers for this student";
          if (reasons.includes("no_eligible_proctor_for_room") || a.proctor_reason) return "no eligible proctor available for this room and time";
          if (reasons.includes("room_capacity_or_availability") || a.room_reason) return "room capacity or availability";
          if (!a.room_id) return "no compatible room could be assigned";
          if (!a.proctor_id) return "no eligible proctor available for this room and time";
          if (!a.equipment_ok) return "required equipment quantity unavailable";
          return "review required";
        };
        let ordered = [...filtered];
        if (view === "candidate")
          ordered.sort(
            (a, b) =>
              a.candidate_name.localeCompare(b.candidate_name) ||
              a.date.localeCompare(b.date) ||
              a.start - b.start,
          );
        if (view === "proctor")
          ordered.sort(
            (a, b) =>
              a.proctor_name.localeCompare(b.proctor_name) ||
              a.date.localeCompare(b.date) ||
              a.start - b.start,
          );
        const rows = ordered.slice(0, visibleCount),
          allSessions = {};
        allocation.forEach((a) => {
          if (!a.room_id) return;
          const k = `${a.room_id}|${a.date}|${a.subject}|${a.paper}|${a.start}`;
          (allSessions[k] ??= {
            room_id: a.room_id,
            date: a.date,
            subject: a.subject,
            paper: a.paper,
            start: a.start,
            end: a.end,
            capacity: a.room_capacity,
            totalCapacity: a.room_total_capacity ?? a.room_capacity,
            unusableSeats: a.room_unusable_seats || 0,
            seats: [],
          }).seats.push(a);
          allSessions[k].end = Math.max(allSessions[k].end, a.end);
        });
        const matchingKeys = new Set(
            filtered.map(
              (a) =>
                `${a.room_id}|${a.date}|${a.subject}|${a.paper}|${a.start}`,
            ),
          ),
          sessions = Object.entries(allSessions)
            .filter(([k]) => matchingKeys.has(k))
            .map(([, v]) => v)
            .sort(
              (a, b) =>
                a.date.localeCompare(b.date) ||
                a.start - b.start ||
                a.room_id.localeCompare(b.room_id),
            ),
          roomRows = sessions.slice(0, visibleCount);

        // Equipment view: one row per equipment type requested by a candidate.
        // It includes successful assignments and unmet requests, not just the
        // equipment field that happened to be assigned.
        const equipmentRowsAll = [];
        filtered.forEach((entry) => {
          const kinds = equipmentKindsFor(entry);
          const assignedKinds = new Set((Array.isArray(entry.equipment_allocations) ? entry.equipment_allocations : []).map(normalizeEquipment));
          const missingKinds = new Set((Array.isArray(entry.missing_equipment) ? entry.missing_equipment : []).map(normalizeEquipment));
          // Compatibility with older single-item allocation responses.
          if (!assignedKinds.size && normalizeEquipment(entry.equipment_status) === "assigned" && kinds.length === 1) assignedKinds.add(kinds[0]);
          kinds.forEach((kind) => {
            let state = "Not assigned";
            if (assignedKinds.has(kind)) state = "Assigned";
            else if (missingKinds.has(kind) || normalizeEquipment(entry.equipment_status) === "quantity_shortage" && normalizeEquipment(entry.equipment) === kind && missingKinds.has(kind)) state = "Quantity shortage";
            else if (normalizeEquipment(entry.equipment_status) === "quantity_shortage") state = "Not allocated · another item unavailable";
            else if (entry.student_conflict || normalizeEquipment(entry.equipment_status) === "not_allocated_candidate_conflict") state = "Not allocated · candidate conflict";
            else if (!entry.room_id || normalizeEquipment(entry.equipment_status) === "not_allocated_room") state = "Not allocated · room unavailable";
            else if (!entry.proctor_id) state = "Pending · proctor unavailable";
            else if (normalizeEquipment(entry.equipment_status) === "pending") state = "Pending";
            equipmentRowsAll.push({
              kind,
              entry,
              state,
              placeholder: false,
            });
          });
        });
        const inventoryTypes = (data.equipment?.records || [])
          .map((item) => String(item.equipment_type ?? "").trim())
          .filter(Boolean);
        const kindsWithRequestsAcrossPlan = new Set(allocation.flatMap(equipmentKindsFor));
        inventoryTypes.forEach((type) => {
          const key = normalizeEquipment(type);
          const alreadyShown = equipmentRowsAll.some((item) => normalizeEquipment(item.kind) === key);
          const queryMatchesType = !q || key.includes(q);
          if (!alreadyShown && queryMatchesType) {
            const requestedInPlan = kindsWithRequestsAcrossPlan.has(key);
            // If the search matches an inventory type but no student row matches,
            // show an explicit empty result rather than hiding that equipment type.
            equipmentRowsAll.push({
              kind: type,
              entry: null,
              state: requestedInPlan ? "No matching requests" : "Not requested",
              placeholder: true,
            });
          }
        });
        equipmentRowsAll.sort((a, b) =>
          a.kind.localeCompare(b.kind) ||
          (a.entry?.date || "9999").localeCompare(b.entry?.date || "9999") ||
          (Number(a.entry?.start) || 0) - (Number(b.entry?.start) || 0) ||
          String(a.entry?.candidate_name || "").localeCompare(String(b.entry?.candidate_name || "")),
        );
        const equipmentRows = equipmentRowsAll.slice(0, visibleCount);

        const body =
          view === "room"
            ? `<div class="room-grid">${
                roomRows
                  .map((s) => {
                    const remaining = Math.max(0, s.capacity - s.seats.length),
                      partial = s.seats.some(
                        (a) => statusOf(a) !== "allocated",
                      );
                    return `<div class="card room-card"><div class="room-card-head"><div><strong>Room ${esc(s.room_id)}</strong><small>${esc(s.date)} · ${esc(s.subject)} ${esc(s.paper)} · ${clock(s.start)}–${clock(s.end)}</small></div><span class="badge ${partial ? "error" : "valid"}">${s.seats.length} / ${s.capacity} usable seats</span></div><div class="room-proctor">Proctor: <strong>${esc(s.seats[0]?.proctor_name || "Unassigned")}</strong>${!s.seats[0]?.proctor_id ? `<span class="draft-badge">Staffing needed</span>` : ""}</div><div class="seat-map">${Array.from(
                      { length: Math.min(s.totalCapacity, 60) },
                      (_, i) => {
                        if (i >= s.capacity)
                          return `<div class="seat broken" title="Seat unavailable: broken desk">×</div>`;
                        const a = s.seats[i],
                          st = a ? statusOf(a) : "";
                        return `<div class="seat ${a ? (st === "allocated" ? "occupied" : "occupied needs-review") : ""}" title="${a ? esc(`${a.candidate_name} · ${a.candidate_id}${st === "allocated" ? "" : " · " + st}`) : "Available seat"}">${a ? `S${String(a.seat).padStart(2, "0")}` : "·"}</div>`;
                      },
                    ).join(
                      "",
                    )}${s.capacity > 60 ? `<div class="seat">+${s.capacity - 60}</div>` : ""}</div><div class="seat-legend"><span><i class="legend-dot"></i>${remaining} seats remaining</span><span><i class="legend-dot free"></i>${s.totalCapacity} installed</span>${s.unusableSeats ? `<span><i class="legend-dot broken-dot"></i>${s.unusableSeats} broken</span>` : ""}${partial ? `<span class="draft-badge">Some seats need review</span>` : ""}</div><div class="footer-note">${s.seats.map((a) => esc(a.candidate_name)).join(" · ")}</div></div>`;
                  })
                  .join("") ||
                `<div class="card empty">No room sessions match this search.</div>`
              }</div>`
            : view === "equipment"
              ? `<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Equipment type</th><th>Candidate</th><th>Examination</th><th>Date / time</th><th>Room / seat</th><th>Proctor</th><th>Equipment status</th></tr></thead><tbody>${equipmentRows.map((item) => item.placeholder
                  ? `<tr><td><strong>${esc(item.kind)}</strong></td><td colspan="5" style="color:var(--muted)">${item.state === "Not requested" ? "No candidates requested this equipment type." : "No requests match the current search."}</td><td><span class="status-pill ${item.state === "Not requested" ? "allocated" : ""}">${esc(item.state)}</span></td></tr>`
                  : `<tr><td><strong>${esc(item.kind)}</strong></td><td>${esc(item.entry.candidate_name || "Unknown candidate")}<small style="display:block;color:var(--muted)">${esc(item.entry.candidate_id || "")}</small></td><td>${esc(item.entry.subject || "")} ${esc(item.entry.paper || "")}</td><td>${esc(item.entry.date || "")}<small style="display:block;color:var(--muted)">${esc(item.entry.start_time || clock(item.entry.start))}–${clock(item.entry.end)}</small></td><td>${esc(item.entry.room_id || "Unassigned")}${item.entry.seat ? ` · Seat ${item.entry.seat}` : ""}</td><td>${esc(item.entry.proctor_name || "Unassigned")}</td><td><span class="status-pill ${item.state === "Assigned" ? "allocated" : item.state.includes("shortage") || item.state.includes("unavailable") || item.state.includes("conflict") ? "unassigned" : "partial"}">${esc(item.state)}</span></td></tr>`).join("") || `<tr><td colspan="7">No equipment requests match this search.</td></tr>`}</tbody></table></div><p class="footer-note equipment-footnote">Each row represents one candidate’s request for one equipment type. Units may be reused in non-overlapping sittings; shortages are shown separately from requests that could not be placed because the room, proctor, or candidate schedule remains unresolved.</p></div>`
              : `<div class="card"><div class="entry-row head"><span>Student / paper</span><span>Room / seat</span><span>Proctor</span><span>Time / status</span></div>${
                  rows
                    .map((a) => {
                      const st = statusOf(a);
                      return `<div class="entry-row"><span><strong>${esc(a.candidate_name)}</strong><small>${esc(a.candidate_id)} · ${esc(a.subject)} ${esc(a.paper)}</small></span><span>${esc(a.room_id || "Unassigned")}${a.seat ? ` · Seat ${a.seat}` : ""}</span><span>${esc(a.proctor_name || "Unassigned")}<small>${esc(a.proctor_id || "")}</small></span><span>${esc(a.date)}<small>${a.start_time}–${clock(a.end)}</small><span class="status-pill ${st}">${st === "allocated" ? "Allocated" : st === "partial" ? "Partial · review" : "Unassigned"}</span>${a.reason_codes?.length ? `<small>${esc(a.reason_codes.join(", ").replace(/_/g, " "))}</small>` : ""}</span></div>`;
                    })
                    .join("") ||
                  `<div class="empty">No entries match this search.</div>`
                }</div>`;
        const shown = view === "room" ? roomRows.length : view === "equipment" ? equipmentRows.length : rows.length,
          total = view === "room" ? sessions.length : view === "equipment" ? equipmentRowsAll.length : filtered.length,
          usedRooms = new Set(
            allocation.filter((a) => a.room_id).map((a) => a.room_id),
          ).size;
        return `<div class="eyebrow">ALLOCATION WORKSPACE · ${allocation.length} EXAM ENTRIES</div><h1>Room seating &amp; allocation</h1><p class="lead">Sessions are prioritized by constraint, packed into seats, and assigned one eligible proctor per occupied room booking. Held contingency resources stay free.</p><div class="metric-row"><div class="card metric"><label>Fully allocated</label><strong>${allocatedCount}</strong><span>of ${allocation.length} exam entries</span></div><div class="card metric"><label>Needs review</label><strong>${unresolved.length}</strong><span>Partial or unassigned</span></div><div class="card metric"><label>Rooms used across all sessions</label><strong>${usedRooms}</strong><span>Distinct rooms assigned; reused between sessions</span></div><div class="card metric"><label>Independent checks</label><strong>${checks.length ? "Review" : "Pass"}</strong><span>${checks.length ? `${checks.length} plan issue(s) detected` : "Room, staff and equipment checks passed"}</span></div></div>${roomUtilizationPanel()}${proctorUtilizationPanel()}${equipmentInventoryPanel()}${reserveControls()}${
          staffingDiagnostics.length
            ? `<div class="card issues" style="margin-bottom:15px"><strong style="color:#954c45">Staffing bottleneck detected</strong>${staffingDiagnostics.map((item) => `<div class="issue-line">${esc(item.message || `${item.start_time}: insufficient eligible proctors.`)}</div>`).join("")}</div>`
            : ""
        }${
          unresolved.length
            ? `<div class="card issues" style="margin-bottom:15px"><strong style="color:#954c45">Unresolved assignments</strong>${unresolved
                .slice(0, 8)
                .map(
                  (a) =>
                    `<div class="issue-line"><strong>${esc(a.candidate_name)} · ${esc(a.subject)} ${esc(a.paper)}</strong>: ${esc(unresolvedReason(a))}.</div>`,
                )
                .join(
                  "",
                )}${unresolved.length > 8 ? `<div class="issue-line">And ${unresolved.length - 8} more. Search for a candidate, room, or proctor to inspect them.</div>` : ""}</div>${advicePanel(unresolved)}`
            : ""
        }${
          checks.length
            ? `<div class="card issues" style="margin-bottom:15px"><strong>Independent plan checks found issues</strong>${checks
                .slice(0, 8)
                .map(
                  (x) =>
                    `<div class="issue-line">${esc(x.resource)} · ${esc(x.issue.replace(/_/g, " "))}</div>`,
                )
                .join("")}</div>`
            : ""
        }<div class="section-head"><div><h2>Schedule</h2><p>Rooms are reused after bookings end. Search room, student, or proctor.</p></div><div class="search-row"><input id="allocation-search" class="search-input" placeholder="Search room, student, proctor, or equipment" value="${esc(allocationSearch)}" oninput="searchAllocation(this.value)"></div></div><div class="section-head" style="margin-top:0"><div class="tabs"><button class="${view === "room" ? "on" : ""}" onclick="setView('room')">Room seating</button><button class="${view === "candidate" ? "on" : ""}" onclick="setView('candidate')">By candidate</button><button class="${view === "proctor" ? "on" : ""}" onclick="setView('proctor')">By proctor</button><button class="${view === "equipment" ? "on" : ""}" onclick="setView('equipment')">By equipment</button></div><span class="entry-count">Showing ${shown} of ${total} ${view === "room" ? "room bookings" : view === "equipment" ? "equipment requests" : "entries"}</span></div>${body}${total > visibleCount ? `<div class="pager"><button class="btn" onclick="showMore()">Show more (${Math.min(20, total - visibleCount)} more)</button></div>` : ""}<div class="tech-note"><strong>Allocation method:</strong> subject-pure room assignments, least-waste subset-sum room bundles when staffing permits, round-robin allocation when proctors are the bottleneck, one proctor per occupied room, protected contingency reserves, and independent room, proctor, and equipment checks. Unresolved entries may indicate resource shortages rather than a seating bug.</div><div class="actions"><button class="btn" onclick="go('data')">Manage data</button><button class="btn primary" onclick="generate()">Regenerate allocation</button></div>`;
      }
      function addRow(k) {
        if (!data[k]) return;
        document.querySelector("#modal-root").innerHTML =
          `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><div class="eyebrow">NEW SOURCE RECORD</div><h2>${esc(schemas[k].short)}</h2></div><button onclick="closeModal()" aria-label="Close">×</button></div><form id="edit-form" onsubmit="event.preventDefault();saveNewRecord('${k}')"><div class="form-grid">${data[k].headers.map((h) => `<label class="field">${esc(h)}<input name="${esc(h)}" autocomplete="off"></label>`).join("")}</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Validate &amp; submit record</button></div></form></div></div>`;
      }
      async function saveNewRecord(k) {
        const form = document.querySelector("#edit-form");
        if (!form) return;
        const fd = new FormData(form),
          row = {};
        data[k].headers.forEach(
          (h) => (row[h] = String(fd.get(h) || "").trim()),
        );
        data[k].records.push(row);
        data[k].apiErrors = [];
        allocation = [];
        dataLimit[k] = Math.max(20, dataLimit[k] || 20);
        closeModal();
        await validateAndSubmit(k);
      }
      async function deleteRow(k, i) {
        if (
          !data[k] ||
          !confirm(`Delete row ${i + 2} from ${schemas[k].short}?`)
        )
          return;
        data[k].records.splice(i, 1);
        data[k].apiErrors = [];
        allocation = [];
        await validateAndSubmit(k);
      }
      function downloadEditedCSV(k) {
        try {
          downloadBlob(`${k}-edited.csv`, csvFor(k), "text/csv");
          setNotice(
            `Downloaded the current ${schemas[k].short.toLowerCase()} table as CSV.`,
            "success",
          );
          render();
        } catch (e) {
          setNotice(`Could not export this table: ${e.message}`);
          render();
        }
      }
      function reserveControls() {
        const held = allocationMeta.reserve || {};
        return `<div class="card reserve-panel"><div><div class="eyebrow">CONTINGENCY BUFFER</div><h3>Hold resources for last-minute changes</h3><p>Reserved resources stay out of the proposed timetable. Change these options and regenerate to compare the plan.</p></div><div class="reserve-options"><label><input type="checkbox" ${allocationOptions.reserve_room ? "checked" : ""} onchange="allocationOptions.reserve_room=this.checked">Keep one operational room aside${held.room ? ` · ${esc(held.room.room_id)} (${held.room.capacity} usable of ${held.room.total_capacity ?? held.room.capacity})` : " · no room currently held"}</label><label><input type="checkbox" ${allocationOptions.reserve_proctor ? "checked" : ""} onchange="allocationOptions.reserve_proctor=this.checked">Keep one broadly eligible proctor aside${held.proctor ? ` · ${esc(held.proctor.proctor_name)}` : " · none currently held"}</label><label><input type="checkbox" ${allocationOptions.reserve_equipment ? "checked" : ""} onchange="allocationOptions.reserve_equipment=this.checked">Keep one unit of equipment types with stock above one aside</label></div><button class="btn" onclick="generate()">Apply reserve settings &amp; regenerate</button></div>`;
      }
      function advicePanel(entries) {
        if (!entries.length) return "";
        const clashes = entries.filter((a) => a.student_conflict),
          rooms = entries.filter((a) => !a.room_id && !a.student_conflict),
          staff = entries.filter((a) => !a.proctor_id && !a.student_conflict),
          equipment = entries.filter((a) => !a.equipment_ok),
          items = [];
        if (clashes.length)
          items.push([
            "Student timetable clashes",
            `${clashes.length} entries overlap another paper for the same student. Move one sitting to a non-overlapping approved time, preserving required duration and access arrangements.`,
          ]);
        if (rooms.length) {
          const usable = (data.rooms?.records || []).filter(
            (r) => (r.status || "available").toLowerCase() === "available",
          ).length;
          items.push([
            "Room capacity or availability",
            `${rooms.length} entries could not be seated; ${usable} rooms are marked operational. Check room capacity, operating hours, and maintenance status. Add a suitable operational room or split the affected subject session across another approved time. Check the contingency panel; releasing its held room, if any, and regenerating may help.`,
          ]);
        }
        if (staff.length)
          items.push([
            "Proctor availability or subject conflict",
            `${staff.length} entries have no eligible proctor. Review staff availability and subjects taught, add another eligible proctor, or move sessions to a time when eligible staff are free. Check whether a contingency proctor is held before regenerating. Do not assign a teacher to an exam in a subject they teach.`,
          ]);
        if (equipment.length) {
          const types = [
            ...new Set(
              equipment.map((a) =>
                (a.equipment || "required equipment").replace(/_/g, " "),
              ),
            ),
          ].join(", ");
          items.push([
            "Equipment quantity",
            `${equipment.length} entries lack equipment (${types}). Check inventory and concurrent bookings; add equipment or stagger affected sittings so units can be reused. If a reserve unit is held, consider releasing it after coordinator approval.`,
          ]);
        }
        return `<section class="card action-plan"><div class="action-plan-head"><div><div class="eyebrow">COORDINATOR REVIEW</div><h2>Suggested recovery steps</h2></div><span class="badge error">${entries.length} unresolved</span></div><p class="footer-note">These are constraint-based suggestions. Confirm exam rules, student arrangements, room safety, and staff availability before changing the schedule. No changes are applied automatically.</p><div class="action-plan-grid">${items.map(([title, body]) => `<div class="action-tip"><strong>${esc(title)}</strong><p>${esc(body)}</p></div>`).join("")}</div></section>`;
      }
      function exportCalendar() {
        try {
          if (
            (calendarScope === "room" || calendarScope === "proctor") &&
            !allocation.length
          ) {
            setNotice(
              "Generate an allocation before exporting room or proctor calendars.",
              "info",
            );
            render();
            return;
          }
          const source = allocation.length
            ? allocation
            : (data.exams?.records || []).map((x) => ({
                ...x,
                start: min(x.start_time),
                end:
                  min(x.start_time) +
                  Number(x.duration_min) +
                  Number(x.extra_time_min || 0) + Number(x.rest_break_min || 0),
              }));
          const from = mondayISO(calendarAnchor || localISO(new Date())),
            to = shiftISO(from, 6),
            events = calendarSessions(calendarScope, source).filter(
              (x) => x.date >= from && x.date <= to,
            );
          if (!events.length) {
            setNotice(
              "There are no events for this resource in the selected week. Choose another week or resource.",
              "info",
            );
            render();
            return;
          }
          const escICS = (s) =>
            String(s || "")
              .replace(/\\/g, "\\\\")
              .replace(/\n/g, "\\n")
              .replace(/,/g, "\\,")
              .replace(/;/g, "\\;");
          const fmt = (date, minutes) => {
            const d = new Date(date + "T12:00:00");
            d.setMinutes(minutes);
            return `${localISO(d).replace(/-/g, "")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
          };
          const lines = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Exam Allocation Manager//Calendar//EN",
            "CALSCALE:GREGORIAN",
            "METHOD:PUBLISH",
          ];
          events.forEach((x, i) => {
            const start = Number(x.start ?? min(x.start_time)),
              end = Number(
                x.end ??
                  start +
                    Number(x.duration_min) +
                    Number(x.extra_time_min || 0),
              ),
              summary =
                calendarScope === "student"
                  ? `${x.subject} ${x.paper}`
                  : `${x.subject} ${x.paper} · ${x.studentCount || 1} candidate(s)`,
              candidateList =
                x.studentNames?.join(", ") || x.candidate_name || "";
            lines.push(
              "BEGIN:VEVENT",
              `UID:${calendarScope}-${calendarResource}-${x.date}-${start}-${i}@exam-allocation-manager`,
              `DTSTAMP:${new Date()
                .toISOString()
                .replace(/[-:]/g, "")
                .replace(/\.\d{3}/, "")}`,
              `DTSTART:${fmt(x.date, start)}`,
              `DTEND:${fmt(x.date, end)}`,
              `SUMMARY:${escICS(summary)}`,
              `LOCATION:${escICS(x.room_id || "Room not assigned")}`,
              `DESCRIPTION:${escICS(`Candidate(s): ${candidateList}\nStudent ID: ${x.candidate_id || "multiple"}\nProctor: ${x.proctor_name || "Unassigned"}\nEquipment: ${x.equipment || "none"}`)}`,
              "END:VEVENT",
            );
          });
          lines.push("END:VCALENDAR");
          downloadBlob(
            `calendar-${calendarScope}-${calendarResource}-${from}.ics`,
            lines.join("\r\n") + "\r\n",
            "text/calendar",
          );
          setNotice(
            `Exported ${events.length} ${calendarScope} calendar event${events.length === 1 ? "" : "s"} for ${from} to ${to}.`,
            "success",
          );
          render();
        } catch (e) {
          setNotice(
            `Calendar export failed: ${e.message || "unexpected export error"}`,
          );
          render();
        }
      }
      addWorkspaceNav();
      render();
    </script>
  </body>
</html>
